{% extends "network/layout.html" %}

{% block body %}
    <div class="container mt-4">
        <h2>New Post</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <textarea class="form-control" name="content" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Post</button>
        </form>
    </div>
{% endblock %}
