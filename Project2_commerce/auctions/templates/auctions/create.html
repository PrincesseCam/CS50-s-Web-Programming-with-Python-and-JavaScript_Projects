{% extends "auctions/layout.html" %}

{% block body %}
    <div class="container mt-5">
        <div class="card">
            <div class="card-header text-center">
                <h2>Create a New Listing</h2>
            </div>
            <div class="card-body">
                <form action="{% url 'create' %}" method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="title">Title:</label>
                        <input type="text" name="title" class="form-control" id="title" placeholder="Enter title">
                    </div>
                    <div class="form-group">
                        <label for="Bid">Starting Bid:</label>
                        <input type="number" step="0.01" id="Bid" name="Bid" required>
                    </div>
                    <div class="form-group">
                        <label for="imageUrl">Image URL:</label>
                        <input type="text" name="imageUrl" class="form-control" id="imageUrl" placeholder="Enter image URL">
                    </div>
                    <div class="form-group">
                        <label for="description">Description:</label>
                        <textarea name="description" class="form-control" id="description" rows="3" placeholder="Enter description"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="category">Category:</label>
                        <select name="category" class="form-control" id="category">
                            <option value="None">None</option>
                            {% for category in categories %}
                            <option value="{{ category.categoryName }}">{{ category }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="active">
                        <label class="form-check-label" for="active">Active</label>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">Create Listing</button>
                    {% if error %}
                    <p style="color: red;">{{ error }}</p>
                    {% endif %}
                </form>
            </div>
        </div>
    </div>
{% endblock %}
